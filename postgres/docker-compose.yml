services:
  postgres:
    image: postgres:16-alpine
    container_name: grist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gristdb}
    ports:
      # Bind on all interfaces so the DB is reachable from outside the host.
      # Change "0.0.0.0" to a specific IP, or restrict access with a firewall.
      - "${POSTGRES_BIND:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grist} -d ${POSTGRES_DB:-gristdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
